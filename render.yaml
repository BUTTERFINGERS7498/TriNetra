# TriNetra — Render = backend API + Redis only
# Frontend (landing + workspace UI) lives on Vercel: https://trinetra-bay.vercel.app
services:
  - type: web
    name: trinetra-workspace
    runtime: docker
    plan: free
    dockerfilePath: ./dashboard/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        fromService:
          name: trinetra-redis
          type: keyvalue
          property: connectionString
      - key: PATCH_DIR
        value: /tmp/patches
      - key: FORK_DIR
        value: /tmp/fork
      - key: SERVE_STATIC
        value: "0"
      - key: PUBLIC_FRONTEND_URL
        value: https://trinetra-bay.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://trinetra-bay.vercel.app

  - type: keyvalue
    name: trinetra-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
