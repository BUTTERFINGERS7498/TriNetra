# Overlay for the SHADOW (decoy) crAPI stack.
#
# Same as override.prod.yml — clears hardcoded container_name and host ports
# on every service so this stack does not collide with the production one —
# but the web entry gets the alias "crapi-web-shadow". Attackers diverted by
# the gateway land on this copy, and the fixer agent patches this stack's
# source — never production.
#
# Launch with:
#   docker compose -p crapi-shadow \
#     -f crapi/upstream/docker-compose.yml -f crapi/override.shadow.yml up -d

services:
  crapi-identity:   { container_name: !reset null, ports: !reset [] }
  crapi-community:  { container_name: !reset null, ports: !reset [] }
  crapi-workshop:   { container_name: !reset null, ports: !reset [] }
  crapi-chatbot:    { container_name: !reset null, ports: !reset [] }
  postgresdb:       { container_name: !reset null, ports: !reset [] }
  mongodb:          { container_name: !reset null, ports: !reset [] }
  chromadb:         { container_name: !reset null, ports: !reset [] }
  mailhog:          { container_name: !reset null, ports: !reset [] }
  api.mypremiumdealership.com: { container_name: !reset null, ports: !reset [] }

  crapi-web:
    container_name: !reset null
    ports: !reset []
    networks:
      default: {}
      defender-net:
        aliases: [crapi-web-shadow]

networks:
  defender-net:
    external: true
