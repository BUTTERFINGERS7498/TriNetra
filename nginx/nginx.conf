# OpenResty (nginx + Lua) gateway for the Webapp Defender.
#
# This is the only public entry point. Lua decides, per session, whether to
# forward to the production app or the shadow decoy, scores traffic, and
# trips honeypots — sharing all state with the rest of the system via Redis.

worker_processes auto;
error_log /dev/stderr info;

# Env vars read by the Lua module (os.getenv); must be declared here.
env PROD_UPSTREAM;
env SHADOW_UPSTREAM;
env SHADOW_THRESHOLD;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env SHADOW_REQUEST_LOG;
env RATE_CAP;

events { worker_connections 1024; }

http {
  lua_package_path "/etc/nginx/lua/?.lua;;";
  lua_shared_dict mem 16m;          # per-session sliding-window counters
  resolver 127.0.0.11 ipv6=off;     # Docker embedded DNS for dynamic proxy_pass
  access_log /dev/stdout;

  init_by_lua_block {
    require "defender"
    math.randomseed(ngx.now() * 1000)
  }

  server {
    listen 8080;

    set $backend "";
    set $sid_hdr "";

    location / {
      access_by_lua_block { require("defender").access() }
      log_by_lua_block    { require("defender").log() }

      # Hand a new client a session cookie so routing is sticky.
      header_filter_by_lua_block {
        if ngx.ctx.is_new and ngx.ctx.sid then
          ngx.header["Set-Cookie"] = "sid=" .. ngx.ctx.sid .. "; Path=/; HttpOnly; SameSite=Lax"
        end
      }

      # Trust only the real peer. Overwrite any client-supplied forwarding or
      # identity headers so they cannot be used to spoof IP or mint sessions.
      proxy_set_header Host $host;
      proxy_set_header X-Session-Id $sid_hdr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Forwarded "";
      proxy_pass http://$backend;
    }
  }
}
